# HPA Baseline — Kubernetes Native Horizontal Pod Autoscaler
# ===========================================================
# Per confronto tesi: DMOS ON vs DMOS OFF vs HPA (K8s nativo)
#
# HPA scala SOLO in base a CPU, senza:
#   - Consapevolezza RTT/geo (Φ_net)
#   - Consapevolezza carbon (Φ_carbon)
#   - Predizione traffico
#   - Coordinamento cross-cluster
#   - Multi-objective scoring
#
# Ogni cluster ha il proprio HPA indipendente (nessuna comunicazione).
# Min/max allineati a quelli di DMOS per confronto equo.
#
# Applicare su OGNI cluster:
#   foreach ($ctx in @("cluster1","cluster2","cluster3")) {
#     kubectl apply -f deployments/hpa-baseline.yaml --context $ctx
#   }
#
# Rimuovere dopo il test:
#   foreach ($ctx in @("cluster1","cluster2","cluster3")) {
#     kubectl delete -f deployments/hpa-baseline.yaml --context $ctx
#   }

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-frontend
  namespace: online-boutique
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 3
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

