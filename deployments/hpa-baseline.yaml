# HPA Baseline — Kubernetes Native Horizontal Pod Autoscaler
# ===========================================================
# Per confronto tesi: DMOS ON vs DMOS OFF vs HPA (K8s nativo)
#
# HPA scala SOLO in base a CPU, senza:
#   - Consapevolezza RTT/geo (Φ_net)
#   - Consapevolezza carbon (Φ_carbon)
#   - Predizione traffico
#   - Coordinamento cross-cluster
#   - Multi-objective scoring
#
# Ogni cluster ha il proprio HPA indipendente (nessuna comunicazione).
# Min/max allineati a quelli di DMOS per confronto equo.
#
# Applicare su OGNI cluster (sostituisci con la tua lista di kubeconfig):
#
#   # Esempio per il setup nuovo a 6 cluster (post proxmox-k3s):
#   1..6 | ForEach-Object {
#     $kc = "$env:USERPROFILE\dmos-iac\kubeconfig-ms-cluster-{0:D2}" -f $_
#     kubectl --kubeconfig $kc apply -f deployments/hpa-baseline.yaml
#   }
#
#   # Esempio legacy testbed thesis (3 cluster):
#   foreach ($ctx in @("cluster1","cluster2","cluster3")) {
#     kubectl apply -f deployments/hpa-baseline.yaml --context $ctx
#   }
#
# Rimuovere dopo il test: stesso loop con `kubectl delete -f`.

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-frontend
  namespace: online-boutique
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 3 
          periodSeconds: 30 #invece di 15
    scaleDown:
      stabilizationWindowSeconds: 120 #invece di 5 minuti
      policies:
        - type: Pods
          value: 1 
          periodSeconds: 60 #invece di 300

