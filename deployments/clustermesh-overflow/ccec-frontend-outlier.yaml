# CiliumClusterwideEnvoyConfig — outlier detection sul Service frontend global.
# Scopo: quando il frontend LOCALE satura e ritorna 5xx, Envoy lo ESPELLE dal
# pool del global service → il traffico va sui frontend REMOTI (failover su
# overload). Con affinity=local sul Service, in condizioni normali si serve
# locale; l'ejection forza il failover solo sotto saturazione.
#
# NB: il "name" del cluster Envoy DEVE essere "<namespace>/<service>".
# Va applicato su OGNI cluster (apply-overflow.sh lo fa).
apiVersion: cilium.io/v2
kind: CiliumClusterwideEnvoyConfig
metadata:
  name: frontend-outlier-detection
spec:
  services:
    - name: frontend
      namespace: online-boutique
  resources:
    - "@type": type.googleapis.com/envoy.config.cluster.v3.Cluster
      name: "online-boutique/frontend"
      connect_timeout: 5s
      lb_policy: ROUND_ROBIN
      type: EDS
      # Circuit breaker: limita le richieste in volo verso il frontend; oltre,
      # Envoy risponde 503 (segnale di sovraccarico che alimenta l'ejection).
      circuit_breakers:
        thresholds:
          - priority: "DEFAULT"
            max_requests: 1024
            max_pending_requests: 1024
            max_retries: 3
      # Outlier detection: espelle gli endpoint che accumulano 5xx.
      outlier_detection:
        # dopo N risposte 5xx consecutive l'endpoint viene espulso
        consecutive_5xx: 5
        # finestra di analisi
        interval: 2s
        # per quanto resta espulso (poi rientra in prova)
        base_ejection_time: 15s
        # può espellere FINO AL 100% dei backend locali → failover completo sui remoti
        max_ejection_percent: 100
        # considera anche errori di connessione locali (timeout/refused), non solo 5xx HTTP
        split_external_local_origin_errors: true
        consecutive_local_origin_failure: 5
        enforcing_consecutive_5xx: 100
        enforcing_consecutive_local_origin_failure: 100
