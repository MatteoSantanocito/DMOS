# Configurazione servizi Online Boutique
services:
  frontend:
    namespace: online-boutique
    deployment_name: frontend

    # Resource requests/limits
    # AGGIORNATO 25/03/2026:
    #   requests: mantenuti bassi (100m/64Mi) per permettere scheduling di 20 repliche
    #             su nodi a 4 core (20×100m=2000m < 4000m allocatable)
    #   limits:   aumentati (500m/256Mi) per dare burst CPU alle repliche sotto carico
    #             e prevenire liveness probe timeout (/_healthz > 1s a 200m throttled)
    resources_per_replica:
      requests:
        cpu: "100m"
        memory: "64Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"

    # Capacità per replica (req/s) — misurata con k6 capacity test isolato.
    #
    # Test: k6_capacity_test.js con backend isolati per cluster (altri a 0),
    # CNP L7 rimossi, CPU limit frontend 500m. Risultati (2026-04-04):
    #   cluster1 (DE, 0ms netem):   49 rps/rep, p95=105ms, 0% err
    #   cluster2 (FR, 150ms netem): 49 rps/rep, p95=395ms, 0% err
    #   cluster3 (PL, 350ms netem): 49 rps/rep, p95=800ms, 0% err
    #
    # Il netem aggiunge latenza ma NON riduce il throughput (arrival-rate test
    # con VU pool sufficiente). La capacità è uniforme su tutti i cluster.
    # Valore raccomandato: 80% del knee point = 39 rps/replica.
    capacity_req_per_sec: 39

    # Capacità per-cluster: misurata isolata = 49 rps/rep (uniforme).
    # Ma con cross-cluster gRPC routing attivo, le goroutine Go del frontend
    # restano bloccate più a lungo sulle call remote → capacità effettiva ridotta.
    # Valori stimati conservativi per scenario reale con cross-cluster:
    capacity_per_cluster:
      cluster1: 39   # DE, 0ms netem — misurato 49, 80% con margine cross-cluster
      cluster2: 35   # FR, 150ms netem — ridotto per gRPC cross-cluster
      cluster3: 30   # PL, 350ms netem — ridotto per gRPC cross-cluster

    # SLA requirements
    # Baseline latenza: p95=60-70ms (idle), p95=130-200ms (under load)
    sla:
      latency_p95_ms: 200  # era 100, ma baseline idle è già 60-70ms
      latency_p99_ms: 500
      availability_percent: 99.9

    # Power consumption (stimato)
    power_watts: 50

    # Autoscaling constraints
    # max_replicas=4: con nuove capacity alte, i backend restano a 1-2 repliche.
    # Budget worst case: 4×500m=2000m frontend + backend(~2650m) = 4650m
    # su 4000m → overcommit ~116% gestibile (backend non tutti al limit).
    autoscaling:
      min_replicas: 1
      max_replicas: 4
      target_cpu_percent: 70

  cartservice:
    namespace: online-boutique
    deployment_name: cartservice
    resources_per_replica:
      requests:
        cpu: "200m"
        memory: "128Mi"
      limits:
        cpu: "300m"
        memory: "256Mi"
    # gRPC read/write su Redis locale, molto leggero.
    # A 150 rps frontend, ~25% traffico è cart (GET+POST) = ~37 rps.
    # 1 replica gRPC gestisce facilmente 50+ rps.
    capacity_req_per_sec: 50
    sla:
      latency_p95_ms: 50
      latency_p99_ms: 100
      availability_percent: 99.95
    power_watts: 60
    autoscaling:
      min_replicas: 1
      # max_replicas=2: con 300m limit × 2 = 600m.
      max_replicas: 2
      target_cpu_percent: 70

  productcatalogservice:
    namespace: online-boutique
    deployment_name: productcatalogservice
    resources_per_replica:
      requests:
        cpu: "150m"
        memory: "96Mi"
      limits:
        cpu: "250m"
        memory: "192Mi"
    # gRPC read-only Go, nessun DB. Estremamente veloce.
    # A 150 rps frontend, ~65% chiama productcatalog = ~97 rps.
    # 1 replica Go read-only gestisce 100+ rps facilmente.
    capacity_req_per_sec: 80
    sla:
      latency_p95_ms: 75
      latency_p99_ms: 150
      availability_percent: 99.9
    power_watts: 55
    autoscaling:
      min_replicas: 1
      # max_replicas=3: con 250m limit × 3 = 750m.
      max_replicas: 3
      target_cpu_percent: 70

  checkoutservice:
    namespace: online-boutique
    deployment_name: checkoutservice
    resources_per_replica:
      requests:
        cpu: "300m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    # Orchestratore: chiama cart, currency, shipping, payment, email.
    # Solo 5% del traffico frontend è checkout = ~7.5 rps a 150 rps.
    # 1 replica gestisce 20+ rps (lento ma poco traffico).
    capacity_req_per_sec: 20
    sla:
      latency_p95_ms: 200
      latency_p99_ms: 500
      availability_percent: 99.95
    power_watts: 70
    autoscaling:
      min_replicas: 1
      # max_replicas=2: checkout è pesante (500m limit) ma traffico basso (5%).
      max_replicas: 2
      target_cpu_percent: 70

  recommendationservice:
    namespace: online-boutique
    deployment_name: recommendationservice
    resources_per_replica:
      requests:
        cpu: "200m"
        memory: "220Mi"
      limits:
        cpu: "400m"
        memory: "450Mi"
    # Python gRPC, chiama productcatalog per ottenere prodotti.
    # ~25% traffico frontend chiama recommendation = ~37 rps.
    # Python è più lento di Go, ma 1 replica gestisce 30+ rps.
    capacity_req_per_sec: 40
    sla:
      latency_p95_ms: 100
      latency_p99_ms: 200
      availability_percent: 99.5
    power_watts: 65
    autoscaling:
      min_replicas: 1
      # max_replicas=2: con 400m limit × 2 = 800m.
      max_replicas: 2
      target_cpu_percent: 70

# Global autoscaling parameters
global_autoscaling:
  # Safety margin sopra predizione
  safety_margin: 0.10  # 10%

  # Rate limiting
  max_delta_per_cycle: 6  # [FIX G] was 4: 2 cicli per raggiungere max_replicas invece di 3 (-30s ramp-up)

  # PD Controller parameters
  pd_controller:
    kp: 5.0
    kd: 300.0

    # Anti-windup
    output_min: -5
    output_max: 5

  # Trend-based prediction
  prediction:
    window_seconds: 300       # 5 min per calcolare derivata
    horizon_seconds: 600      # Predici 10 min avanti
    smoothing_alpha: 0.3      # EMA smoothing (opzionale)
