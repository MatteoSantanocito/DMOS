# Configurazione servizi Online Boutique
services:
  frontend:
    namespace: online-boutique
    deployment_name: frontend

    # Resource requests/limits
    # AGGIORNATO 25/03/2026:
    #   requests: mantenuti bassi (100m/64Mi) per permettere scheduling di 20 repliche
    #             su nodi a 4 core (20×100m=2000m < 4000m allocatable)
    #   limits:   aumentati (500m/256Mi) per dare burst CPU alle repliche sotto carico
    #             e prevenire liveness probe timeout (/_healthz > 1s a 200m throttled)
    resources_per_replica:
      requests:
        cpu: "100m"
        memory: "64Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"

    # Capacità per replica (req/s) — valore calibrato con netem attivo
    #
    # CONTESTO: con tc netem attivo sui cluster geografici simulati:
    #   cluster1 (DE, no netem):  ~16 rps/replica
    #   cluster2 (FR, 150ms):     ~6  rps/replica  (netem su risposte egressa)
    #   cluster3 (PL, 350ms):     ~3  rps/replica
    #
    # DMOS usa un unico valore per tutti i cluster. Impostare questo
    # alla capacità del cluster PIU' LENTO (c3) per evitare che DMOS
    # rimanga incastrato a min_replicas=1 sui cluster con netem elevato.
    # Valore scelto: 5 rps — leggermente sopra c3 per evitare oscillazioni,
    # ma sotto c2 e c1 → tutti i cluster escono dal single-replica trap.
    #
    # Effetto con max_replicas=8 e 400+ utenti al picco:
    #   cluster1 (DE, 350 gCO2) → ~6-8 repliche  (limitato da carbon score)
    #   cluster2 (FR,  80 gCO2) → ~8 repliche     (preferito, al cap → verde)
    #   cluster3 (PL, 650 gCO2) → ~2-4 repliche   (penalizzato, meno traffico)
    # Cap a 8: 8×500m=4000m = esattamente i 4 core del nodo → no saturazione.
    capacity_req_per_sec: 30

    # SLA requirements
    # Baseline latenza: p95=60-70ms (idle), p95=130-200ms (under load)
    sla:
      latency_p95_ms: 200  # era 100, ma baseline idle è già 60-70ms
      latency_p99_ms: 500
      availability_percent: 99.9
    
    # Power consumption (stimato)
    power_watts: 50
    
    # Autoscaling constraints
    # max_replicas=8: con 4 core/nodo e limit=500m/replica → 8×500m=4000m = esatto cap nodo.
    # Evita saturazione fisica quando DMOS concentra repliche su cluster green (FR).
    min_replicas_per_cluster:
      cluster1: 2
      cluster2: 2
      cluster3: 1   # min 1 — DMOS decide in base allo score (penalizzato da RTT)

    max_replicas_per_cluster:
      cluster1: 5
      cluster2: 4
      cluster3: 3   # max 3, limitato per nodo C3

    autoscaling:
      min_replicas: 2
      max_replicas: 8
      target_cpu_percent: 70

  cartservice:
    namespace: online-boutique
    deployment_name: cartservice
    resources_per_replica:
      requests:
        cpu: "200m"
        memory: "128Mi"
      limits:
        cpu: "300m"
        memory: "256Mi"
    capacity_req_per_sec: 10
    sla:
      latency_p95_ms: 50
      latency_p99_ms: 100
      availability_percent: 99.95
    power_watts: 60
    autoscaling:
      min_replicas: 1
      max_replicas: 8
      target_cpu_percent: 70

  productcatalogservice:
    namespace: online-boutique
    deployment_name: productcatalogservice
    resources_per_replica:
      requests:
        cpu: "150m"
        memory: "96Mi"
      limits:
        cpu: "250m"
        memory: "192Mi"
    capacity_req_per_sec: 20  # [FIX H] was 15: 2 repliche baseline reggono 40 req/s senza triggerare HIGH durante warmup k6 (10 req/s k6 × 3.5x = 35 req/s < 40 cap)
    sla:
      latency_p95_ms: 75
      latency_p99_ms: 150
      availability_percent: 99.9
    power_watts: 55
    autoscaling:
      # min_replicas=2: vedi commento frontend — stesso rationale.
      # productcatalogservice è co-locato col frontend e riceve molto traffico
      # (browsing prodotti = 25% degli endpoint), quindi beneficia allo stesso modo.
      min_replicas: 2
      # [FIX J] Aumentato da 12 a 16: cluster2 (FR, preferito dal carbon score) riceve
      # 200-228 req/s al picco → serve 14-16 repliche (228/20×1.15=13.1). Con max=12
      # era costantemente a tetto (base=14-16 vincolato=True nel log) → saturazione
      # sostenuta per 600s → sorgente principale dei 19961 5xx.
      # Limite CPU: 16×250m=4000m = esattamente 4 core del nodo → no saturazione.
      # Memory: 16×96Mi=1536Mi → OK su nodo 8GB.
      max_replicas: 16
      target_cpu_percent: 70

  checkoutservice:
    namespace: online-boutique
    deployment_name: checkoutservice
    resources_per_replica:
      requests:
        cpu: "300m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    capacity_req_per_sec: 5
    sla:
      latency_p95_ms: 200
      latency_p99_ms: 500
      availability_percent: 99.95
    power_watts: 70
    autoscaling:
      min_replicas: 1
      max_replicas: 8
      target_cpu_percent: 70

  recommendationservice:
    namespace: online-boutique
    deployment_name: recommendationservice
    resources_per_replica:
      requests:
        cpu: "200m"
        memory: "220Mi"
      limits:
        cpu: "400m"
        memory: "450Mi"
    capacity_req_per_sec: 10
    sla:
      latency_p95_ms: 100
      latency_p99_ms: 200
      availability_percent: 99.5
    power_watts: 65
    autoscaling:
      min_replicas: 1
      max_replicas: 8
      target_cpu_percent: 70

# Global autoscaling parameters
global_autoscaling:
  # Safety margin sopra predizione
  safety_margin: 0.10  # 15%
  
  # Rate limiting
  max_delta_per_cycle: 6  # [FIX G] was 4: 2 cicli per raggiungere max_replicas invece di 3 (-30s ramp-up)
  
  # PD Controller parameters
  pd_controller:
    kp: 5.0
    kd: 300.0
    
    # Anti-windup
    output_min: -5
    output_max: 5
  
  # Trend-based prediction
  prediction:
    window_seconds: 300       # 5 min per calcolare derivata
    horizon_seconds: 600      # Predici 10 min avanti
    smoothing_alpha: 0.3      # EMA smoothing (opzionale)