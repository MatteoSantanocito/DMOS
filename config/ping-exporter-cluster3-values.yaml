# ping_exporter Helm values — cluster3 (Warsaw/PL, 192.168.1.247)
#
# SCOPO:
#   Configura ping_exporter per misurare la RTT dal cluster3 verso i nodi
#   degli altri cluster (cluster1 = Frankfurt, cluster2 = Paris).
#
# DEPLOY:
#   helm upgrade --install ping-exporter czerwonk/ping-exporter \
#     --namespace observability --create-namespace \
#     --context cluster3 \
#     -f config/ping-exporter-cluster3-values.yaml
#
# OUTPUT ATTESO (dopo setup tc netem):
#   ping_rtt_mean_seconds{target="192.168.1.245"} 0.350  ← Frankfurt, 350ms
#     (delay outgoing di cluster3 → RTT ≈ 350ms)
#   ping_rtt_mean_seconds{target="192.168.1.246"} 0.500  ← Paris, ~500ms
#     (cluster3 delay 350ms + cluster2 delay 150ms → 500ms)

config:
  targets:
    - host: 192.168.1.245
      name: "cluster1-frankfurt-de"
    - host: 192.168.1.246
      name: "cluster2-paris-fr"

  interval: 1s
  timeout: 3s
  payload-size: 56

serviceMonitor:
  enabled: true
  namespace: observability
  labels:
    release: prometheus

service:
  type: ClusterIP
  port: 9427

resources:
  requests:
    memory: "32Mi"
    cpu: "10m"
  limits:
    memory: "64Mi"
    cpu: "50m"
