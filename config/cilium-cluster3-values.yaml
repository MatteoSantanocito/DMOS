# Cilium cluster3 — valori completi (esistenti + Hubble metrics)
# Generato da: helm get values cilium -n kube-system --kubeconfig .kube/cluster3.yaml

# ── Configurazione esistente (invariata) ──────────────────────────────────
cluster:
  id: 3
  name: cluster3

clustermesh:
  apiserver:
    service:
      type: NodePort
    tls:
      auto:
        enabled: true
        method: cronJob
        schedule: "0 0 1 */4 *"
  config:
    clusters:
    - ips:
      - 192.168.1.245
      name: cluster1
      port: 32379
    - ips:
      - 192.168.1.246
      name: cluster2
      port: 32379
    enabled: true
  mcsapi:
    enabled: false
  useAPIServer: true

ipam:
  mode: kubernetes

k8sServiceHost: 192.168.1.247
k8sServicePort: 6443
kubeProxyReplacement: true

operator:
  replicas: 1

routingMode: tunnel
tunnelProtocol: vxlan

# ── Fix nil pointer per nuovi campi Cilium 1.16.5 ─────────────────────────
certgen:
  cronJob:
    successfulJobsHistoryLimit: 0

standaloneDnsProxy:
  enabled: false

# ── Hubble HTTP metrics (NUOVO) ───────────────────────────────────────────
hubble:
  enabled: true       # obbligatorio: avvia il Hubble subsystem e il metrics server
  metrics:
    enableOpenMetrics: true
    enabled:
      - "httpV2:exemplars=true;labelsContext=source_namespace,source_workload,destination_namespace,destination_workload,traffic_direction"
      - "drop"
      - "tcp"
      - "flow"
      - "icmp"
      - "dns"
    serviceMonitor:
      enabled: true
      labels:
        release: prometheus
      interval: "15s"
